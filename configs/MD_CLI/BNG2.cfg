# Apply: edit-config private -> exit all -> paste -> validate -> commit
configure {
    port 1/1/c1 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c2 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c3 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c3/1 {
        admin-state enable
    }
    port 1/1/c4 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c4/1 {
        admin-state enable
    }
    lag "lag-1" {
        admin-state enable
        encap-type dot1q
        mode access
        lacp {
            mode active
            administrative-key 32768
        }
        access {
            per-fp-ing-queuing true
            per-fp-egr-queuing true
            per-fp-sap-instance true
            adapt-qos {
                mode distribute
                include-egr-hash-cfg true
            }
        }
        per-link-hash {
            weighted {
                auto-rebalance true
            }
        }
        port 1/1/c1/1 {
        }
        port 1/1/c2/1 {
        }
    }
    lag "lag-2" {
        admin-state enable
        port 1/1/c3/1 {
        }
        port 1/1/c4/1 {
        }
    }
    redundancy {
        multi-chassis {
            peer 1.1.1.1 {
                admin-state enable
                mc-lag {
                    admin-state enable
                    keep-alive-interval 5
                    hold-on-neighbor-failure 2
                    lag "lag-1" {
                        lacp-key 1
                        system-id 00:00:00:00:00:01
                        system-priority 100
                    }
                }
                sync {
                    admin-state enable
                    local-dhcp-server true
                    srrp true
                    sub-mgmt {
                        ipoe true
                        pppoe true
                    }
                    tags {
                        lag "lag-1" {
                            sync-tag "SUBS-LAG1"
                        }
                    }
                }
            }
        }
    }
    router "Base" {
        interface "system" {
            ipv4 {
                primary {
                    address 2.2.2.2
                    prefix-length 32
                }
            }
        }
        interface "toBNG1" {
            port lag-2
            ipv4 {
                primary {
                    address 172.16.1.1
                    prefix-length 24
                }
            }
        }
        ospf 0 {
            admin-state enable
            area 0.0.0.0 {
                interface "system" {
                }
                interface "toBNG1" {
                }
            }
        }
    }
    service {
        customer "1" {
            customer-id 1
            description "Default customer"
        }
        vprn "18" {
            admin-state enable
            service-id 18
            customer "1"
            dhcp-server {
                dhcpv4 "LOCAL" {
                    admin-state enable
                    pool-selection {
                        use-gi-address {
                            scope subnet
                        }
                    }
                    failover {
                        admin-state enable
                        peer 1.1.1.1 {
                            sync-tag "LOCAL-DHCP"
                        }
                    }
                    pool "pool-1" {
                        options {
                            option lease-time {
                                duration 120
                            }
                        }
                        subnet 10.1.1.0/24 {
                            options {
                                option subnet-mask {
                                    ipv4-address [255.255.255.0]
                                }
                                option default-router {
                                    ipv4-address [10.1.1.254]
                                }
                            }
                            address-range 10.1.1.150 end 10.1.1.200 {
                                failover-control-type access-driven
                            }
                        }
                    }
                }
            }
            interface "loopback" {
                loopback true
                ipv4 {
                    local-dhcp-server "LOCAL"
                    primary {
                        address 192.168.1.1
                        prefix-length 32
                    }
                }
            }
            subscriber-interface "toSubs" {
                admin-state enable
                ipv4 {
                    address 10.1.1.254 {
                        prefix-length 24
                    }
                }
                group-interface "subs" {
                    admin-state enable
                    ipv4 {
                        dhcp {
                            admin-state enable
                            server [192.168.1.1]
                            gi-address 10.1.1.254
                            lease-populate {
                                max-leases 70
                            }
                        }
                    }
                    sap lag-1:100 {
                    }
                }
            }
        }
    }
}
